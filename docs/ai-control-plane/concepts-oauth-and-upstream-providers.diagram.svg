<svg x="664" y="217" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FA873C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
<text x="712" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="start">AI Control Plane</text>
<text x="712" y="254" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a" text-anchor="start">authorization server + client</text>
<rect x="1200" y="180" width="320" height="104" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/>
<svg x="1224" y="217" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
<text x="1272" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="start">Upstream service</text>
<text x="1272" y="254" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a" text-anchor="start">Linear · GitHub · Slack · IdP</text>
<line x1="400" y1="232" x2="634" y2="232" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="960" y1="232" x2="1194" y2="232" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="218" font-family="Menlo, monospace" font-size="13" fill="#8DB483" text-anchor="middle" letter-spacing="2">1 · sign in</text>
<text x="1080" y="218" font-family="Menlo, monospace" font-size="13" fill="#5B9BEF" text-anchor="middle" letter-spacing="2">2 · credential</text>
<rect x="80" y="320" width="710" height="236" rx="12" fill="#0f0f0f" stroke="#8DB483" stroke-width="2"/>
<text x="108" y="360" font-family="Menlo, monospace" font-size="13" fill="#8DB483" text-anchor="start" letter-spacing="3">INBOUND</text>
<text x="108" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="start">The control plane is the authorization server</text>
<circle cx="113" cy="425" r="3" fill="#8DB483"/>
<text x="128" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#bbbbbb" text-anchor="start">Clients identify with DCR or a CIMD and sign in with PKCE</text>
<circle cx="113" cy="455" r="3" fill="#8DB483"/>
<text x="128" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#bbbbbb" text-anchor="start">Consent screen on every sign-in, no OAuth scopes</text>
<circle cx="113" cy="485" r="3" fill="#8DB483"/>
<text x="128" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#bbbbbb" text-anchor="start">One-hour access tokens, rotating refresh tokens</text>
<circle cx="113" cy="515" r="3" fill="#8DB483"/>
<text x="128" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#bbbbbb" text-anchor="start">Decides who is calling</text>
<rect x="810" y="320" width="710" height="236" rx="12" fill="#0f0f0f" stroke="#5B9BEF" stroke-width="2"/>
<text x="838" y="360" font-family="Menlo, monospace" font-size="13" fill="#5B9BEF" text-anchor="start" letter-spacing="3">UPSTREAM</text>
<text x="838" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="start">The control plane is an OAuth client</text>
<circle cx="843" cy="425" r="3" fill="#5B9BEF"/>
<text x="858" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#bbbbbb" text-anchor="start">Remote identity providers at platform, org, or project tier</text>
<circle cx="843" cy="455" r="3" fill="#5B9BEF"/>
<text x="858" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#bbbbbb" text-anchor="start">Per-user token, shared agent credential, or none</text>
<circle cx="843" cy="485" r="3" fill="#5B9BEF"/>
<text x="858" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#bbbbbb" text-anchor="start">Tokens encrypted at rest and refreshed before use</text>
<circle cx="843" cy="515" r="3" fill="#5B9BEF"/>
<text x="858" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#bbbbbb" text-anchor="start">Decides which credential reaches the API</text>
<text x="80" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#555555" text-anchor="start">The two relationships are configured, refreshed, and revoked separately. Revoking a sign-in does not revoke the grant at the upstream provider.</text>
</svg>
