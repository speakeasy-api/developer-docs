<rect width="1600" height="640" fill="#0a0a0a"/>
<text x="80" y="62" font-family="Menlo, monospace" font-size="16" fill="#777777" text-anchor="start" letter-spacing="4">MCP GATEWAY · OAUTH</text>
<text x="80" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="start">Two OAuth relationships on every governed connection</text>
