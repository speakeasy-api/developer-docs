<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<desc>Render instructions (kept in desc, not a comment, because XML comments cannot contain double hyphens).
 Source for public/assets/docs/ai-control-plane/diagrams/access-and-servers/dcr-vs-cimd.webp.
     Replaces the Mermaid sequence diagram on client-registration.mdx.
     Render at 1600x1080 with a 2x device scale factor (3200x2160), then convert to WebP:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
         --allow-file-access-from-files --window-size=1600,1080 --force-device-scale-factor=2 \
         --screenshot=dcr-vs-cimd.png file://$PWD/dcr-vs-cimd.diagram.svg
       cwebp -quiet -q 90 dcr-vs-cimd.png -o public/assets/docs/ai-control-plane/diagrams/access-and-servers/dcr-vs-cimd.webp
     Style follows src/content/blog/release-cimd-verified-mcp-clients/diagram-source.svg.
     Colors: DCR uses the MCP Gateway section color (ember, rgb 250,135,60); CIMD uses the
     Identity section color (moss, rgb 90,130,80).
     Icons: Speakeasy isotype from public/svg/speakeasy-icon.svg, laptop and globe glyphs from lucide-react. </desc>
<defs><linearGradient id="rainbowH" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="rgb(50,15,30)"/><stop offset="13%" stop-color="rgb(200,50,40)"/>
  <stop offset="25%" stop-color="rgb(251,135,63)"/><stop offset="38%" stop-color="rgb(210,220,145)"/>
  <stop offset="50%" stop-color="rgb(90,130,80)"/><stop offset="62%" stop-color="rgb(0,35,20)"/>
  <stop offset="74%" stop-color="rgb(0,20,60)"/><stop offset="86%" stop-color="rgb(40,115,215)"/>
  <stop offset="100%" stop-color="rgb(155,195,255)"/></linearGradient>
  <marker id="arrowEmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgb(250,135,60)"/></marker>
  <marker id="arrowMoss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="rgb(90,130,80)"/></marker>
</defs>
<rect width="1600" height="1080" fill="#0a0a0a"/>
<text x="80" y="62" font-family="Menlo, monospace" font-size="16" letter-spacing="4" fill="#777777">MCP OAUTH · CLIENT REGISTRATION</text>
<text x="80" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#ffffff">DCR and CIMD differ in who asserts the client identity</text>
<rect x="80" y="128" width="1440" height="2" fill="url(#rainbowH)"/>

<!-- column labels -->
<text x="300" y="192" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a8a8a" text-anchor="middle">MCP CLIENT</text>
<text x="800" y="192" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a8a8a" text-anchor="middle">AI CONTROL PLANE</text>
<text x="1300" y="192" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a8a8a" text-anchor="middle">CLIENT VENDOR</text>

<!-- lifelines -->
<line x1="300" y1="306" x2="300" y2="980" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="800" y1="306" x2="800" y2="980" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="1300" y1="306" x2="1300" y2="980" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4 6"/>

<!-- participants -->
<rect x="140" y="214" width="320" height="92" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/>
<svg x="164" y="240" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z"/><path d="M20.054 15.987H3.946"/></svg>
<text x="224" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">MCP client</text>
<text x="224" y="278" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">has no client ID in advance</text>

<rect x="640" y="214" width="320" height="92" rx="12" fill="#0f0f0f" stroke="#666666" stroke-width="2"/>
<svg x="664" y="240" width="40" height="40" viewBox="0 0 101 97"><path fill="#ffffff" d="M71.288 91.564 5.403 82.202l-5.05 4.38L71.287 96.66l29.064-25.215-5.044-.715-24.02 20.835Z"/><path fill="#ffffff" d="m71.288 76.28 29.064-25.216-5.044-.714-24.02 20.828-23.509-3.338-32.288-4.582-10.088-1.435-5.05 4.38 10.094 1.429L.352 76.386l70.936 10.076 29.064-25.208-5.044-.715-24.014 20.835-33.61-4.779 5.045-4.374 28.559 4.058Z"/><path fill="#ffffff" d="M71.288 60.989 5.403 51.627l-5.05 4.38 70.935 10.076 29.064-25.208-5.044-.715-24.02 20.829Z"/><path fill="#ffffff" d="M95.308 19.774 85.213 28.53 71.288 40.61 44.056 36.74 5.403 31.247l-5.05 4.38 38.653 5.487-5.045 4.381-28.565-4.058-5.044 4.38 70.936 10.076 29.064-25.208-10.095-1.435 10.095-8.761-5.044-.715Z"/><path fill="#ffffff" d="M100.352 10.3 29.416.223.352 25.432l70.936 10.082L100.352 10.3Z"/></svg>
<text x="724" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Speakeasy</text>
<text x="724" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">OAuth authorization server</text>

<rect x="1140" y="214" width="320" height="92" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/>
<svg x="1164" y="240" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
<text x="1224" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Client vendor domain</text>
<text x="1224" y="278" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">hosts the metadata document</text>

<!-- ========== DCR ========== -->
<rect x="80" y="340" width="1440" height="30" fill="#0a0a0a"/>
<text x="80" y="362" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="rgb(250,135,60)">DCR · RFC 7591</text>
<text x="1520" y="362" font-family="Menlo, monospace" font-size="13" letter-spacing="3" fill="#8a8a8a" text-anchor="end">THE CLIENT ASSERTS ITS OWN IDENTITY</text>
<line x1="80" y1="378" x2="1520" y2="378" stroke="#2a2a2a" stroke-width="2"/>

<!-- step 1 -->
<circle cx="104" cy="430" r="14" fill="#0a0a0a" stroke="rgb(250,135,60)" stroke-width="2.5"/>
<text x="104" y="435" font-family="Menlo, monospace" font-size="13" fill="rgb(250,135,60)" text-anchor="middle">1</text>
<text x="550" y="418" font-family="Menlo, monospace" font-size="15" fill="#ffffff" text-anchor="middle">POST /register</text>
<line x1="300" y1="430" x2="794" y2="430" stroke="rgb(250,135,60)" stroke-width="2" marker-end="url(#arrowEmber)"/>
<text x="550" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a" text-anchor="middle">client name and redirect URIs</text>

<!-- step 2 -->
<circle cx="104" cy="506" r="14" fill="#0a0a0a" stroke="rgb(250,135,60)" stroke-width="2.5"/>
<text x="104" y="511" font-family="Menlo, monospace" font-size="13" fill="rgb(250,135,60)" text-anchor="middle">2</text>
<text x="550" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">New client ID for this install</text>
<line x1="800" y1="506" x2="306" y2="506" stroke="rgb(250,135,60)" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowEmber)"/>
<text x="550" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a" text-anchor="middle">every install registers separately</text>

<!-- step 3 -->
<circle cx="104" cy="582" r="14" fill="#0a0a0a" stroke="rgb(250,135,60)" stroke-width="2.5"/>
<text x="104" y="587" font-family="Menlo, monospace" font-size="13" fill="rgb(250,135,60)" text-anchor="middle">3</text>
<text x="550" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="15">/authorize</tspan> with that client ID</text>
<line x1="300" y1="582" x2="794" y2="582" stroke="rgb(250,135,60)" stroke-width="2" marker-end="url(#arrowEmber)"/>
<text x="550" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a" text-anchor="middle">redirect URI must match a registered one exactly</text>

<!-- ========== CIMD ========== -->
<rect x="80" y="640" width="1440" height="30" fill="#0a0a0a"/>
<text x="80" y="662" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="rgb(90,130,80)">CIMD · CLIENT ID METADATA DOCUMENT</text>
<text x="1520" y="662" font-family="Menlo, monospace" font-size="13" letter-spacing="3" fill="#8a8a8a" text-anchor="end">THE VENDOR DOMAIN ASSERTS IT</text>
<line x1="80" y1="678" x2="1520" y2="678" stroke="#2a2a2a" stroke-width="2"/>

<!-- step 1 -->
<circle cx="104" cy="730" r="14" fill="#0a0a0a" stroke="rgb(90,130,80)" stroke-width="2.5"/>
<text x="104" y="735" font-family="Menlo, monospace" font-size="13" fill="rgb(90,130,80)" text-anchor="middle">1</text>
<text x="550" y="718" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle"><tspan font-family="Menlo, monospace" font-size="15">/authorize</tspan> with <tspan font-family="Menlo, monospace" font-size="15">client_id</tspan> = HTTPS URL</text>
<line x1="300" y1="730" x2="794" y2="730" stroke="rgb(90,130,80)" stroke-width="2" marker-end="url(#arrowMoss)"/>
<text x="550" y="754" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a" text-anchor="middle">no registration · same client ID on every install</text>

<!-- step 2 -->
<circle cx="104" cy="806" r="14" fill="#0a0a0a" stroke="rgb(90,130,80)" stroke-width="2.5"/>
<text x="104" y="811" font-family="Menlo, monospace" font-size="13" fill="rgb(90,130,80)" text-anchor="middle">2</text>
<text x="1050" y="794" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">GET client metadata document</text>
<line x1="800" y1="806" x2="1294" y2="806" stroke="rgb(90,130,80)" stroke-width="2" marker-end="url(#arrowMoss)"/>
<text x="1050" y="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a" text-anchor="middle">fetched from the client ID URL</text>

<!-- step 3 -->
<circle cx="104" cy="882" r="14" fill="#0a0a0a" stroke="rgb(90,130,80)" stroke-width="2.5"/>
<text x="104" y="887" font-family="Menlo, monospace" font-size="13" fill="rgb(90,130,80)" text-anchor="middle">3</text>
<text x="1050" y="870" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Name and redirect URIs</text>
<line x1="1300" y1="882" x2="806" y2="882" stroke="rgb(90,130,80)" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowMoss)"/>
<text x="1050" y="906" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a" text-anchor="middle">client_name · redirect_uris</text>

<!-- step 4: self check -->
<circle cx="104" cy="952" r="14" fill="#0a0a0a" stroke="rgb(90,130,80)" stroke-width="2.5"/>
<text x="104" y="957" font-family="Menlo, monospace" font-size="13" fill="rgb(90,130,80)" text-anchor="middle">4</text>
<path d="M800 936 H850 V966 H806" fill="none" stroke="rgb(90,130,80)" stroke-width="2" marker-end="url(#arrowMoss)"/>
<text x="872" y="946" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff">Check <tspan font-family="Menlo, monospace" font-size="15">client_id</tspan> matches the URL</text>
<text x="872" y="970" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">and the requested redirect URI is listed</text>

<text x="80" y="1040" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#666666">Client access decides which CIMD clients a server admits. DCR stays open to every client.</text>
</svg>
