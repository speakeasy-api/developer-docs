<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<!-- Source for public/assets/docs/ai-control-plane/diagrams/concepts/agent-permissions.webp.
     Styled after concepts/index.diagram.svg.
     Render command is in the desc element below (XML comments cannot contain double hyphens).
     No icons; shapes only. -->
<desc>Render at 1600x820 with a 2x device scale factor (3200x1640), then convert to WebP:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1600,820 --force-device-scale-factor=2 --screenshot=agent-permissions.png file://$PWD/concepts-agent-identity-model.diagram.svg
  cwebp -quiet -q 90 agent-permissions.png -o public/assets/docs/ai-control-plane/diagrams/concepts/agent-permissions.webp &amp;&amp; rm agent-permissions.png</desc>
<defs><linearGradient id="rainbowH" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="rgb(50,15,30)"/><stop offset="13%" stop-color="rgb(200,50,40)"/>
  <stop offset="25%" stop-color="rgb(251,135,63)"/><stop offset="38%" stop-color="rgb(210,220,145)"/>
  <stop offset="50%" stop-color="rgb(90,130,80)"/><stop offset="62%" stop-color="rgb(0,35,20)"/>
  <stop offset="74%" stop-color="rgb(0,20,60)"/><stop offset="86%" stop-color="rgb(40,115,215)"/>
  <stop offset="100%" stop-color="rgb(155,195,255)"/></linearGradient>
<clipPath id="clipA"><circle cx="470" cy="360" r="170"/></clipPath>
<clipPath id="clipB"><circle cx="680" cy="360" r="170"/></clipPath>
</defs>
<rect width="1600" height="820" fill="#0a0a0a"/>
<text x="80" y="62" font-family="Menlo, monospace" font-size="16" fill="#777777" text-anchor="start" letter-spacing="4">AI CONTROL PLANE · AGENT IDENTITY</text>
<text x="80" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="start">An agent request is allowed only where all three policies agree</text>
<rect x="80" y="128" width="1440" height="2" fill="url(#rainbowH)"/>
<circle cx="470" cy="360" r="170" fill="#5B9BEF" fill-opacity="0.07" stroke="#5B9BEF" stroke-width="2"/>
<circle cx="680" cy="360" r="170" fill="#8DB483" fill-opacity="0.07" stroke="#8DB483" stroke-width="2"/>
<circle cx="575" cy="540" r="170" fill="#E5574A" fill-opacity="0.07" stroke="#E5574A" stroke-width="2"/>
<g clip-path="url(#clipA)"><g clip-path="url(#clipB)"><circle cx="575" cy="540" r="170" fill="#FA873C" fill-opacity="0.55" stroke="#FA873C" stroke-width="3"/></g></g>
<text x="400" y="310" font-family="Menlo, monospace" font-size="13" fill="#5B9BEF" text-anchor="middle" letter-spacing="2">CREDENTIAL</text>
<text x="400" y="330" font-family="Menlo, monospace" font-size="13" fill="#5B9BEF" text-anchor="middle" letter-spacing="2">MAXIMUM</text>
<text x="750" y="310" font-family="Menlo, monospace" font-size="13" fill="#8DB483" text-anchor="middle" letter-spacing="2">AGENT</text>
<text x="750" y="330" font-family="Menlo, monospace" font-size="13" fill="#8DB483" text-anchor="middle" letter-spacing="2">POLICY</text>
<text x="575" y="640" font-family="Menlo, monospace" font-size="13" fill="#E5574A" text-anchor="middle" letter-spacing="2">OWNER POLICY</text>
<text x="575" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">Effective</text>
<rect x="960" y="176" width="560" height="104" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/>
<circle cx="994" cy="212" r="10" fill="#5B9BEF" fill-opacity="0.2" stroke="#5B9BEF" stroke-width="2"/>
<text x="1020" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="start">Credential maximum</text>
<text x="1020" y="244" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a" text-anchor="start">Fixed when a person issues the API key</text>
<text x="1020" y="264" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a" text-anchor="start">or approves the MCP session. Never widened.</text>
<rect x="960" y="300" width="560" height="104" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/>
<circle cx="994" cy="336" r="10" fill="#8DB483" fill-opacity="0.2" stroke="#8DB483" stroke-width="2"/>
<text x="1020" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="start">Agent policy</text>
<text x="1020" y="368" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a" text-anchor="start">The agent's own permissions plus its roles.</text>
<text x="1020" y="388" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a" text-anchor="start">Read live on every request.</text>
<rect x="960" y="424" width="560" height="104" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/>
<circle cx="994" cy="460" r="10" fill="#E5574A" fill-opacity="0.2" stroke="#E5574A" stroke-width="2"/>
<text x="1020" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="start">Owner policy</text>
<text x="1020" y="492" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a" text-anchor="start">The owner's current permissions.</text>
<text x="1020" y="512" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a" text-anchor="start">Read live on every request.</text>
<rect x="960" y="548" width="560" height="104" rx="12" fill="#0f0f0f" stroke="#FA873C" stroke-width="2"/>
<circle cx="994" cy="584" r="10" fill="#FA873C" fill-opacity="0.55" stroke="#FA873C" stroke-width="2"/>
<text x="1020" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="start">Effective permission</text>
<text x="1020" y="616" font-family="Menlo, monospace" font-size="13" fill="#FA873C" text-anchor="start">credential ∩ agent ∩ owner</text>
<text x="1020" y="636" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a" text-anchor="start">Workloads run as their agent and add no policy.</text>
<text x="80" y="784" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#555555" text-anchor="start">Removing a permission from the agent or its owner takes effect on the next request. No failure falls back to the owner's broader access.</text>
</svg>
