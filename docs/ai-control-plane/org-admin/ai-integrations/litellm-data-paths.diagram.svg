<text x="200" y="200" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a8a8a" text-anchor="middle">CALLER</text><text x="780" y="200" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a8a8a" text-anchor="middle">LITELLM · GATEWAY AND ROUTER</text><text x="1395" y="200" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a8a8a" text-anchor="middle">MODEL PROVIDER</text><rect x="80" y="230" width="240" height="110" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/><svg x="104" y="256" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#ffffff"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg><text x="156" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Application</text><text x="156" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">sends model requests</text><path d="M320 285 H454" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ag)"/><rect x="460" y="230" width="640" height="110" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/><image href="../../../../../../public/assets/docs/integrations/litellm.png" x="484" y="254" width="44" height="44"/><text x="546" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">LiteLLM proxy</text><text x="546" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">keeps model selection, provider credentials, retries, and budgets</text><text x="546" y="322" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">Generic Guardrail API · OTel exporter</text><rect x="1270" y="230" width="250" height="110" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/><svg x="1294" y="256" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#ffffff"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg><text x="1346" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Model provider</text><text x="1346" y="304" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">OpenAI · Anthropic</text><text x="1346" y="322" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">and others</text><path d="M1100 268 H1264" fill="none" stroke="#d3d3d3" stroke-width="2" marker-end="url(#aw)"/><text x="1185" y="256" font-family="Menlo, monospace" font-size="12" fill="#d3d3d3" text-anchor="middle">3 · allowed request</text><path d="M1270 306 H1106" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ag)"/><text x="1185" y="326" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a" text-anchor="middle">response</text><rect x="80" y="440" width="1440" height="400" rx="16" fill="#0f0f0f" stroke="#666666" stroke-width="2"/><svg x="110" y="470" width="40" height="38" viewBox="0 0 101 97"><path fill="#ffffff" d="M71.288 91.564 5.403 82.202l-5.05 4.38L71.287 96.66l29.064-25.215-5.044-.715-24.02 20.835Z"/><path fill="#ffffff" d="m71.288 76.28 29.064-25.216-5.044-.714-24.02 20.828-23.509-3.338-32.288-4.582-10.088-1.435-5.05 4.38 10.094 1.429L.352 76.386l70.936 10.076 29.064-25.208-5.044-.715-24.014 20.835-33.61-4.779 5.045-4.374 28.559 4.058Z"/><path fill="#ffffff" d="M71.288 60.989 5.403 51.627l-5.05 4.38 70.935 10.076 29.064-25.208-5.044-.715-24.02 20.829Z"/><path fill="#ffffff" d="M95.308 19.774 85.213 28.53 71.288 40.61 44.056 36.74 5.403 31.247l-5.05 4.38 38.653 5.487-5.045 4.381-28.565-4.058-5.044 4.38 70.936 10.076 29.064-25.208-10.095-1.435 10.095-8.761-5.044-.715Z"/><path fill="#ffffff" d="M100.352 10.3 29.416.223.352 25.432l70.936 10.082L100.352 10.3Z"/></svg><text x="110" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">AI Control Plane</text><text x="110" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">never the model proxy</text><text x="110" y="640" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">matching project header</text><text x="110" y="604" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">every route requires the</text><text x="110" y="622" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">integration key and</text><rect x="360" y="470" width="560" height="140" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/><text x="384" y="498" font-family="Menlo, monospace" font-size="12" letter-spacing="2" fill="#C83228">SYNCHRONOUS · SECURITY AND POLICY</text><text x="384" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Guardrail endpoint</text><text x="384" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">LiteLLM Generic Guardrail API · pre_call and post_call</text><text x="384" y="584" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">/rpc/litellm.ingest/beta/litellm_basic_guardrail_api</text><rect x="360" y="700" width="560" height="110" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/><svg x="384" y="724" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#C83228" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#C83228"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg><text x="436" y="748" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Risk findings and session capture</text><text x="436" y="772" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">prompts checked against risk policies</text><path d="M640 610 V694" fill="none" stroke="#C83228" stroke-width="2" marker-end="url(#ar)"/><rect x="1000" y="470" width="490" height="140" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/><text x="1024" y="498" font-family="Menlo, monospace" font-size="12" letter-spacing="2" fill="#2873D7">ASYNCHRONOUS · OBSERVABILITY</text><text x="1024" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Telemetry endpoint</text><text x="1024" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">OTLP · JSON or protobuf · optional gzip</text><text x="1024" y="576" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">/rpc/hooks.otel/v1/traces</text><text x="1024" y="594" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">/rpc/hooks.otel/v1/metrics (opt-in)</text><rect x="1000" y="700" width="490" height="110" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/><svg x="1024" y="724" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2873D7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#2873D7"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><text x="1076" y="748" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Observability and cost views</text><text x="1076" y="772" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">model · tokens · cost · duration</text><path d="M1245 610 V694" fill="none" stroke="#2873D7" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ab)"/><path d="M500 340 V464" fill="none" stroke="#C83228" stroke-width="2" marker-end="url(#ar)"/><text x="512" y="384" font-family="Menlo, monospace" font-size="12" fill="#C83228">1 · pre-call</text><text x="512" y="400" font-family="Menlo, monospace" font-size="12" fill="#C83228">policy check</text><path d="M660 464 V346" fill="none" stroke="#C83228" stroke-width="2" marker-end="url(#ar)"/><text x="672" y="384" font-family="Menlo, monospace" font-size="12" fill="#C83228">2 · allow</text><text x="672" y="400" font-family="Menlo, monospace" font-size="12" fill="#C83228">or block</text><path d="M820 340 V464" fill="none" stroke="#C83228" stroke-width="2" marker-end="url(#ar)"/><text x="832" y="384" font-family="Menlo, monospace" font-size="12" fill="#C83228">4 · post-call</text><text x="832" y="400" font-family="Menlo, monospace" font-size="12" fill="#C83228">capture</text><path d="M1040 340 V464" fill="none" stroke="#2873D7" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ab)"/><text x="1052" y="384" font-family="Menlo, monospace" font-size="12" fill="#2873D7">metadata-only</text><text x="1052" y="400" font-family="Menlo, monospace" font-size="12" fill="#2873D7">OTel export</text><text x="80" y="884" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#555555">A blocked prompt never reaches the model provider. Policies set to warn behave as blocks for LiteLLM traffic.</text></svg>
