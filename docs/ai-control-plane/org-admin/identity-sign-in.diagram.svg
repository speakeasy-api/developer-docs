<text x="530.0" y="348" font-family="Menlo, monospace" font-size="13" letter-spacing="3" fill="rgb(90,130,80)" text-anchor="middle">1 · SIGN IN</text>
<text x="530.0" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">User clicks sign in</text>
<text x="530.0" y="428" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a" text-anchor="middle">the AI Control Plane delegates to the identity layer</text>
<path d="M806 482 H1334" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="1070.0" cy="482" r="12" fill="#0a0a0a" stroke="rgb(90,130,80)" stroke-width="3"/>
<circle cx="1070.0" cy="482" r="4" fill="rgb(90,130,80)"/>
<text x="1070.0" y="458" font-family="Menlo, monospace" font-size="13" letter-spacing="3" fill="rgb(90,130,80)" text-anchor="middle">2 · REDIRECT</text>
<text x="1070.0" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Redirect to the organization's IDP</text>
<text x="1070.0" y="538" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a" text-anchor="middle">the company's own sign-in screen</text>
<path d="M1334 592 H806" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="1070.0" cy="592" r="12" fill="#0a0a0a" stroke="rgb(90,130,80)" stroke-width="3"/>
<circle cx="1070.0" cy="592" r="4" fill="rgb(90,130,80)"/>
<text x="1070.0" y="568" font-family="Menlo, monospace" font-size="13" letter-spacing="3" fill="rgb(90,130,80)" text-anchor="middle">3 · AUTHENTICATE</text>
<text x="1070.0" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">User authenticates and returns</text>
<text x="1070.0" y="648" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a" text-anchor="middle">MFA · device trust · conditional access</text>
<path d="M794 702 H266" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="530.0" cy="702" r="12" fill="#0a0a0a" stroke="rgb(90,130,80)" stroke-width="3"/>
<circle cx="530.0" cy="702" r="4" fill="rgb(90,130,80)"/>
<text x="530.0" y="678" font-family="Menlo, monospace" font-size="13" letter-spacing="3" fill="rgb(90,130,80)" text-anchor="middle">4 · CALLBACK</text>
<text x="530.0" y="738" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Return authorization code</text>
<text x="530.0" y="758" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a" text-anchor="middle">OAuth callback</text>
<path d="M266 812 H794" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="530.0" cy="812" r="12" fill="#0a0a0a" stroke="rgb(90,130,80)" stroke-width="3"/>
<circle cx="530.0" cy="812" r="4" fill="rgb(90,130,80)"/>
<text x="530.0" y="788" font-family="Menlo, monospace" font-size="13" letter-spacing="3" fill="rgb(90,130,80)" text-anchor="middle">5 · EXCHANGE</text>
<text x="530.0" y="848" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Exchange code for ID token</text>
<text x="530.0" y="868" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a" text-anchor="middle">signed ID token</text>
<path d="M794 922 H266" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="530.0" cy="922" r="12" fill="#0a0a0a" stroke="rgb(90,130,80)" stroke-width="3"/>
<circle cx="530.0" cy="922" r="4" fill="rgb(90,130,80)"/>
<text x="530.0" y="898" font-family="Menlo, monospace" font-size="13" letter-spacing="3" fill="rgb(90,130,80)" text-anchor="middle">6 · IDENTITY</text>
<text x="530.0" y="958" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Return user, email, and display name</text>
<text x="530.0" y="978" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a" text-anchor="middle">plus the IDP user id from the directory</text>
<path d="M266 1026 H336 V1070 H268" fill="none" stroke="rgb(90,130,80)" stroke-width="2" marker-end="url(#arrowMoss)"/>
<circle cx="336" cy="1048" r="12" fill="#0a0a0a" stroke="rgb(90,130,80)" stroke-width="3"/>
<circle cx="336" cy="1048" r="4" fill="rgb(90,130,80)"/>
<text x="370" y="1030" font-family="Menlo, monospace" font-size="13" letter-spacing="3" fill="rgb(90,130,80)">7 · SESSION</text>
<text x="370" y="1056" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff">Set session, land on workspace</text>
<text x="370" y="1076" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">usually a no-op upsert</text>
<text x="80" y="1116" font-family="Menlo, monospace" font-size="12" fill="#666666">SYNCHRONOUS · RUNS ON EVERY SIGN-IN · ~500 MS END TO END</text>
