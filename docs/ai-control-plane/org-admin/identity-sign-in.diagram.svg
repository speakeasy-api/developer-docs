<text x="1244" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Organization IDP</text>
<text x="1244" y="274" font-family="Menlo, monospace" font-size="12" fill="#8a8a8a">Okta · Azure AD · Google</text>
