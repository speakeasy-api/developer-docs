<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
<!-- Source for public/assets/docs/ai-control-plane/diagrams/secure/mcp-scoped-policies.webp.
     Styled after concepts-security-and-policy.diagram.svg.
     Render command is in the desc element below (XML comments cannot contain double hyphens). -->
<desc>Render at 1600x740 with a 2x device scale factor (3200x1480), then convert to WebP:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1600,740 --force-device-scale-factor=2 --screenshot=mcp-scoped-policies.png file://$PWD/mcp-scoped-policies.diagram.svg
  cwebp -quiet -q 90 mcp-scoped-policies.png -o public/assets/docs/ai-control-plane/diagrams/secure/mcp-scoped-policies.webp &amp;&amp; rm mcp-scoped-policies.png</desc>
<defs><linearGradient id="rainbowH" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="rgb(50,15,30)"/><stop offset="13%" stop-color="rgb(200,50,40)"/>
  <stop offset="25%" stop-color="rgb(251,135,63)"/><stop offset="38%" stop-color="rgb(210,220,145)"/>
  <stop offset="50%" stop-color="rgb(90,130,80)"/><stop offset="62%" stop-color="rgb(0,35,20)"/>
  <stop offset="74%" stop-color="rgb(0,20,60)"/><stop offset="86%" stop-color="rgb(40,115,215)"/>
  <stop offset="100%" stop-color="rgb(155,195,255)"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a8a"/></marker>
<marker id="arrowEmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FA873C"/></marker>
</defs>
<rect width="1600" height="740" fill="#0a0a0a"/>
<text x="80" y="62" font-family="Menlo, monospace" font-size="16" fill="#777777" letter-spacing="4">SECURITY AND POLICY · MCP-SCOPED POLICIES</text>
<text x="80" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#ffffff">The gateway checks both directions of a tool call</text>
<rect x="80" y="128" width="1440" height="2" fill="url(#rainbowH)"/>

<!-- Inference boundaries: where content enters the model provider's context -->
<rect x="350" y="196" width="200" height="420" fill="#a78bfa" fill-opacity="0.07"/>
<line x1="350" y1="196" x2="350" y2="616" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 6"/>
<text x="350" y="184" font-family="Menlo, monospace" font-size="13" fill="#a78bfa" letter-spacing="2">INFERENCE BOUNDARY</text>
<rect x="1150" y="196" width="200" height="420" fill="#a78bfa" fill-opacity="0.07"/>
<line x1="1150" y1="196" x2="1150" y2="616" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 6"/>
<text x="1150" y="184" font-family="Menlo, monospace" font-size="13" fill="#a78bfa" letter-spacing="2">INFERENCE BOUNDARY</text>

<!-- Gateway bracket -->
<rect x="815" y="206" width="325" height="152" rx="14" fill="none" stroke="#FA873C" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="977" y="226" font-family="Menlo, monospace" font-size="12" fill="#FA873C" text-anchor="middle" letter-spacing="2">SPEAKEASY MCP GATEWAY</text>

<!-- Call path -->
<text x="80" y="222" font-family="Menlo, monospace" font-size="13" fill="#777777" letter-spacing="3">CALL PATH</text>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
  <rect x="80" y="240" width="200" height="90" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/>
  <text x="180" y="278" font-size="21" fill="#ffffff">User prompt</text>
  <text x="180" y="306" font-family="Menlo, monospace" font-size="14" fill="#9a9a9a">"refund card 4111..."</text>

  <rect x="370" y="240" width="160" height="90" rx="12" fill="#17131f" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="278" font-size="21" fill="#ffffff">Model</text>
  <text x="450" y="306" font-family="Menlo, monospace" font-size="14" fill="#9a9a9a">provider</text>

  <rect x="590" y="240" width="200" height="90" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/>
  <text x="690" y="278" font-size="21" fill="#ffffff">Tool call</text>
  <text x="690" y="306" font-family="Menlo, monospace" font-size="14" fill="#9a9a9a">args from the model</text>

  <rect x="880" y="240" width="200" height="90" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/>
  <text x="980" y="278" font-size="21" fill="#ffffff">MCP server</text>
  <text x="980" y="306" font-family="Menlo, monospace" font-size="14" fill="#9a9a9a">runs, returns result</text>

  <rect x="1170" y="240" width="160" height="90" rx="12" fill="#17131f" stroke="#a78bfa" stroke-width="2"/>
  <text x="1250" y="278" font-size="21" fill="#ffffff">Model</text>
  <text x="1250" y="306" font-family="Menlo, monospace" font-size="14" fill="#9a9a9a">reads result</text>

  <rect x="1380" y="240" width="140" height="90" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/>
  <text x="1450" y="278" font-size="21" fill="#ffffff">Assistant</text>
  <text x="1450" y="306" font-family="Menlo, monospace" font-size="14" fill="#9a9a9a">reply</text>
</g>
<g stroke="#8a8a8a" stroke-width="2" fill="none" marker-end="url(#arrow)">
  <line x1="280" y1="285" x2="366" y2="285"/>
  <line x1="530" y1="285" x2="586" y2="285"/>
  <line x1="790" y1="285" x2="876" y2="285"/>
  <line x1="1080" y1="285" x2="1166" y2="285"/>
  <line x1="1330" y1="285" x2="1376" y2="285"/>
</g>
<!-- Check points -->
<circle cx="318" cy="285" r="9" fill="#5B9BEF"/>
<circle cx="835" cy="285" r="9" fill="#4fd1a5"/>
<circle cx="1118" cy="285" r="9" fill="#4fd1a5"/>
<g stroke-width="2">
  <line x1="318" y1="296" x2="318" y2="470" stroke="#5B9BEF"/>
  <line x1="835" y1="296" x2="835" y2="470" stroke="#4fd1a5"/>
  <line x1="1118" y1="296" x2="1118" y2="470" stroke="#4fd1a5"/>
</g>

<!-- Withheld result annotation -->
<path d="M 1000 340 C 1010 400, 1100 404, 1200 404" fill="none" stroke="#FA873C" stroke-width="2" marker-end="url(#arrowEmber)"/>
<text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#FA873C"><tspan x="1212" y="410">a withheld result</tspan><tspan x="1162" y="434">never reaches the model</tspan></text>

<!-- Checks -->
<text x="80" y="462" font-family="Menlo, monospace" font-size="13" fill="#777777" letter-spacing="3">CHECKS</text>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
  <rect x="140" y="470" width="356" height="96" rx="12" fill="#0d1726" stroke="#5B9BEF" stroke-width="2"/>
  <text x="318" y="506" font-size="20" fill="#ffffff">Everywhere policies</text>
  <text x="318" y="536" font-family="Menlo, monospace" font-size="14" fill="#9fb8d8">agent hooks · chat capture</text>

  <rect x="640" y="470" width="330" height="96" rx="12" fill="#0c1f19" stroke="#4fd1a5" stroke-width="2"/>
  <text x="805" y="506" font-size="20" fill="#ffffff">MCP-scoped · request</text>
  <text x="805" y="536" font-family="Menlo, monospace" font-size="14" fill="#9fd8c4">Block: denied, server never runs</text>

  <rect x="1000" y="470" width="340" height="96" rx="12" fill="#0c1f19" stroke="#4fd1a5" stroke-width="2"/>
  <text x="1170" y="506" font-size="20" fill="#ffffff">MCP-scoped · response</text>
  <text x="1170" y="536" font-family="Menlo, monospace" font-size="14" fill="#9fd8c4">Block: result withheld</text>
</g>

<text x="80" y="664" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#8a8a8a">Each check runs before the next step, so a Block policy stops the call there. A Flag policy records the finding and lets the call through.</text>
<text x="80" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#8a8a8a">MCP-scoped policies run only at the gateway, and Everywhere policies only through hooks and chat capture.</text>
</svg>
