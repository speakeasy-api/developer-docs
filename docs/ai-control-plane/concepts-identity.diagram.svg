<text x="80" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#555555" text-anchor="start">People, agents, and workloads resolve to one principal, which the platform represents to upstream systems with the matching credential.</text>
