<rect width="1600" height="720" fill="#0a0a0a"/>
<text x="80" y="62" font-family="Menlo, monospace" font-size="16" letter-spacing="4" fill="#777777">MCP GATEWAY · MULTI-TENANT</text>
<text x="80" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#ffffff">One Control Plane server per tenant of the same vendor</text>
<rect x="80" y="128" width="1440" height="2" fill="url(#rainbowH)"/>
<text x="210" y="196" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a8a8a" text-anchor="middle">AGENTS</text><text x="720" y="196" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a8a8a" text-anchor="middle">AI CONTROL PLANE</text><text x="1315" y="196" font-family="Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a8a8a" text-anchor="middle">VENDOR</text><rect x="80" y="340" width="260" height="130" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/><svg x="104" y="364" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#ffffff"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg><text x="156" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Agents</text><text x="156" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">connect to Control</text><text x="156" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">Plane URLs, never to</text><text x="156" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">the vendor directly</text><rect x="440" y="230" width="560" height="400" rx="16" fill="#0f0f0f" stroke="#666666" stroke-width="2"/><svg x="468" y="256" width="44" height="42" viewBox="0 0 101 97"><path fill="#ffffff" d="M71.288 91.564 5.403 82.202l-5.05 4.38L71.287 96.66l29.064-25.215-5.044-.715-24.02 20.835Z"/><path fill="#ffffff" d="m71.288 76.28 29.064-25.216-5.044-.714-24.02 20.828-23.509-3.338-32.288-4.582-10.088-1.435-5.05 4.38 10.094 1.429L.352 76.386l70.936 10.076 29.064-25.208-5.044-.715-24.014 20.835-33.61-4.779 5.045-4.374 28.559 4.058Z"/><path fill="#ffffff" d="M71.288 60.989 5.403 51.627l-5.05 4.38 70.935 10.076 29.064-25.208-5.044-.715-24.02 20.829Z"/><path fill="#ffffff" d="M95.308 19.774 85.213 28.53 71.288 40.61 44.056 36.74 5.403 31.247l-5.05 4.38 38.653 5.487-5.045 4.381-28.565-4.058-5.044 4.38 70.936 10.076 29.064-25.208-10.095-1.435 10.095-8.761-5.044-.715Z"/><path fill="#ffffff" d="M100.352 10.3 29.416.223.352 25.432l70.936 10.082L100.352 10.3Z"/></svg><text x="530" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff">Two installs of one catalog entry</text><text x="530" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8a8a8a">each install is an independent remote MCP server</text><line x1="468" y1="326" x2="972" y2="326" stroke="#2a2a2a" stroke-width="2"/><rect x="470" y="350" width="500" height="110" rx="12" fill="#0a0a0a" stroke="#FB873F" stroke-width="2"/><svg x="494" y="374" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FB873F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#FB873F"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg><text x="546" y="396" font-family="Menlo, monospace" font-size="20" fill="#ffffff">vendor-prod</text><text x="546" y="422" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a">own slug · upstream headers · access rules</text><text x="546" y="442" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a">own plugin membership · tool logs</text><path d="M340 405 H400 V405 H464" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ag)"/><rect x="470" y="490" width="500" height="110" rx="12" fill="#0a0a0a" stroke="#FB873F" stroke-width="2"/><svg x="494" y="514" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FB873F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#FB873F"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg><text x="546" y="536" font-family="Menlo, monospace" font-size="20" fill="#ffffff">vendor-staging</text><text x="546" y="562" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a">own slug · upstream headers · access rules</text><text x="546" y="582" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a">own plugin membership · tool logs</text><path d="M340 405 H400 V545 H464" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ag)"/><rect x="1110" y="230" width="410" height="400" rx="16" fill="#0f0f0f" stroke="#666666" stroke-width="2"/><svg x="1138" y="256" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#ffffff"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg><text x="1194" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Vendor MCP deployment</text><text x="1194" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">one MCP URL for both tenants</text><line x1="1138" y1="326" x2="1492" y2="326" stroke="#2a2a2a" stroke-width="2"/><rect x="1140" y="350" width="350" height="110" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/><text x="1164" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Production tenant</text><text x="1164" y="424" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a">own data · own credentials</text><path d="M970 405 H1134" fill="none" stroke="#FB873F" stroke-width="2" marker-end="url(#ae)"/><text x="1055" y="393" font-family="Menlo, monospace" font-size="12" fill="#FB873F" text-anchor="middle">prod</text><text x="1055" y="433" font-family="Menlo, monospace" font-size="12" fill="#FB873F" text-anchor="middle">credentials</text><rect x="1140" y="490" width="350" height="110" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="2"/><text x="1164" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff">Staging tenant</text><text x="1164" y="564" font-family="Menlo, monospace" font-size="13" fill="#8a8a8a">own data · own credentials</text><path d="M970 545 H1134" fill="none" stroke="#FB873F" stroke-width="2" marker-end="url(#ae)"/><text x="1055" y="533" font-family="Menlo, monospace" font-size="12" fill="#FB873F" text-anchor="middle">staging</text><text x="1055" y="573" font-family="Menlo, monospace" font-size="12" fill="#FB873F" text-anchor="middle">credentials</text><text x="80" y="686" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#555555">An API key stored on one tenant's server is never sent on calls through another tenant's server.</text></svg>
